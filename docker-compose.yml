services:
  app:
    # Both services share one image: the backup container is the same build, started with a
    # different command. Set EMDASH_IMAGE to reuse a registry tag instead of building locally.
    image: ${EMDASH_IMAGE:-emdash-local}
    build:
      context: .
    container_name: emdash-demo-app
    env_file: .env
    ports:
      - "4321:4321"
    volumes:
      - ./data:/app/data
      - ./import:/import:ro
    restart: unless-stopped

  # Online SQLite backups into ./backups (see "Backups" in README.md). Deliberately has no
  # env_file and no ports: it only needs the database and a place to write copies.
  backup:
    image: ${EMDASH_IMAGE:-emdash-local}
    build:
      context: .
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    depends_on:
      - app
    environment:
      TZ: UTC
      KEEP: "28"
      INTERVAL: "21600"
    volumes:
      # Read-write on purpose: a WAL reader needs the -shm file beside the database. The script
      # opens the database through `?mode=ro` and never writes here.
      - ./data:/app/data
      - ./backups:/app/backups
    command: ["/bin/sh", "/app/backup/run.sh"]
