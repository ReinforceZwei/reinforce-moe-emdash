name: image

# Release artifact policy:
#   push to main      -> ghcr.io/...:edge + :sha-<short>   (staging/preview only)
#   tag vX.Y.Z        -> :X.Y.Z, :X.Y, :X, :latest + GitHub Release (production)
# Production must pin the immutable X.Y.Z tag (or its digest); `latest` never comes from main.
#
# No EMDASH_SITE_URL build arg on purpose: it only feeds image.remotePatterns for the
# same-origin media proxy (local storage). Media lives on R2 and its host is authorised
# by `publicUrl` on the s3() adapter instead. EMDASH_SITE_URL is still required at
# *runtime* for passkeys, absolute URLs and email links.

on:
  push:
    branches: [main]
    tags: ['v*.*.*']

permissions:
  contents: write # create the GitHub Release
  packages: write # push to GHCR

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}; use release.sh"
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=short,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=reinforce.moe
            org.opencontainers.image.description=reinforce.moe — EmDash site, SQLite + R2
            org.opencontainers.image.licenses=UNLICENSED

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          name: ${{ github.ref_name }}
